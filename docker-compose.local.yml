# ==============================================================================
# Price Hunter - Modalidade 1: Instalação 100% Local (PostgreSQL Próprio em Docker)
# ==============================================================================
version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: pricehunter-frontend:latest
    container_name: pricehunter-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pricehunter-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: pricehunter-backend:latest
    container_name: pricehunter-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pwd_123}@postgres:5432/${POSTGRES_DB:-pricehunter}
      - DB_POOL_MODE=direct
      - REDIS_URL=redis://:${REDIS_PASSWORD:-pricehunter_redis_secret}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - pricehunter-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: pricehunter-worker:latest
    container_name: pricehunter-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pwd_123}@postgres:5432/${POSTGRES_DB:-pricehunter}
      - DB_POOL_MODE=direct
      - REDIS_URL=redis://:${REDIS_PASSWORD:-pricehunter_redis_secret}@redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pricehunter-network

  redis:
    image: redis:7.2-alpine
    container_name: pricehunter-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-pricehunter_redis_secret}"
    volumes:
      - redis_data:/data
    networks:
      - pricehunter-network

  postgres:
    image: postgres:16-alpine
    container_name: pricehunter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pricehunter}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pwd_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - pricehunter-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pricehunter}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: pricehunter_postgres_data
    driver: local
  redis_data:
    name: pricehunter_redis_data
    driver: local

networks:
  pricehunter-network:
    name: pricehunter-network
    driver: bridge
